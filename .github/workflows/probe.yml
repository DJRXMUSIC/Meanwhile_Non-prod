# Temporary: prints current Google Maven versions + runner SDK contents (removed after M1 setup).
name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Google Maven versions
        run: |
          for a in com/android/tools/build/gradle androidx/compose/compose-bom androidx/room/room-runtime androidx/work/work-runtime androidx/activity/activity-compose androidx/lifecycle/lifecycle-runtime-compose androidx/lifecycle/lifecycle-service androidx/navigation/navigation-compose androidx/core/core-ktx androidx/datastore/datastore-preferences androidx/test/ext/junit androidx/test/runner androidx/compose/material3/material3 androidx/compose/material/material-icons-extended androidx/sqlite/sqlite-bundled androidx/core/core-splashscreen; do
            echo "== $a"; curl -s "https://dl.google.com/dl/android/maven2/$a/maven-metadata.xml" | grep -oE '<version>[^<]+' | sed 's/<version>//' | tail -25 | tr '\n' ' '; echo
          done
      - name: Runner SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"; ls $ANDROID_HOME/platforms $ANDROID_HOME/build-tools; java -version 2>&1; ls /usr/lib/jvm
