name: supabase

# Applies SQL migrations and deploys Edge Functions to Danny's Supabase project.
# Needs only the SUPABASE_ACCESS_TOKEN secret (docs/INSTALL.md); the android workflow creates the project.
on:
  push:
    branches: ['**']
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/tests/**'
      - 'scripts/ci/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  # Nothing is deployed unless these pass. No secrets in this job.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: SQL contract tests (every migration, RLS, append-only, views)
        run: supabase/tests/run_sql_tests.sh

      - name: Setup automation tests (scripts/ci against a mock Management API)
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/test_supabase_setup.py

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: ${{ !cancelled() }}
        with:
          deno-version: v2.x

      - name: Edge Function tests
        if: ${{ !cancelled() }}
        run: |
          deno check --config supabase/functions/ai/deno.json supabase/functions/ai/index.ts
          deno test --allow-env --allow-read --config supabase/functions/ai/deno.json supabase/functions/ai/ai_test.ts

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets go only to the steps that use them; actions are pinned to commit SHAs.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Supabase (schema, auth)
        id: supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          echo "## Setup status (docs/INSTALL.md)" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/ci/supabase_setup.py backend

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        if: steps.supabase.outputs.ref != ''
        with:
          version: latest

      - name: Deploy Edge Functions
        if: steps.supabase.outputs.ref != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.supabase.outputs.ref }}
        run: supabase functions deploy ai --project-ref "$PROJECT_REF"
