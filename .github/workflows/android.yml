name: android

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
      - 'supabase/**'
      # legacy PWA files that still live in this repo
      - 'src/**'
      - 'public/**'
      - 'netlify/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ github.run_number }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Domain unit tests (dose engine golden tests)
        run: ./gradlew -p domain test --console=plain

      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: App unit tests + release APK
        run: ./gradlew :app:testReleaseUnitTest :app:assembleRelease --console=plain

      - name: Collect APK
        id: apk
        run: |
          VERSION_NAME="$(grep -E '^appVersion=' gradle.properties | cut -d= -f2).${{ github.run_number }}"
          SRC="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          mkdir -p out
          cp "$SRC" "out/MeanwhileV4-$VERSION_NAME.apk"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          if [ -n "$KEYSTORE_PATH" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-artifact@v6
        with:
          name: apk
          path: out/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: steps.apk.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.apk.outputs.version_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk --clobber
          else
            gh release create "$TAG" out/*.apk \
              --title "MeanwhileV4 ${{ steps.apk.outputs.version_name }}" \
              --notes-file docs/RELEASE_NOTES.md \
              --target "${{ github.sha }}" \
              --latest
          fi

      - name: Signing secrets missing
        if: steps.apk.outputs.signed != 'true'
        run: echo "::warning::APK built but not released. Add the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets (docs/INSTALL.md), then re-run this workflow."
