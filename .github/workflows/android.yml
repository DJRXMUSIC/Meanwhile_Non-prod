name: android

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
      - 'supabase/**'
      # legacy PWA files that still live in this repo
      - 'src/**'
      - 'public/**'
      - 'netlify/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Secrets are given only to the steps that need them (not to third-party actions), and actions
    # are pinned to commit SHAs so a moved tag can't run new code next to the signing key.
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          # The repo's default branch is not this app's branch, so allow cache writes everywhere.
          cache-read-only: false

      - name: Domain unit tests (dose engine golden tests)
        run: ./gradlew -p domain test --console=plain

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: App unit tests + release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --console=plain

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Collect APK
        id: apk
        run: |
          VERSION_NAME="$(grep -E '^appVersion=' gradle.properties | cut -d= -f2).${{ github.run_number }}"
          SRC="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          mkdir -p out
          cp "$SRC" "out/MeanwhileV4-$VERSION_NAME.apk"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          if [ -n "$KEYSTORE_PATH" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: apk
          path: out/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: steps.apk.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.apk.outputs.version_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk --clobber
          else
            gh release create "$TAG" out/*.apk \
              --title "MeanwhileV4 ${{ steps.apk.outputs.version_name }}" \
              --notes-file docs/RELEASE_NOTES.md \
              --target "${{ github.sha }}" \
              --latest
          fi

      - name: Signing secrets missing
        if: steps.apk.outputs.signed != 'true'
        run: echo "::warning::APK built but not released. Add the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets (docs/INSTALL.md), then re-run this workflow."
