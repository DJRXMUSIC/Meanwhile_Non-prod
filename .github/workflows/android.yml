name: android

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
      - 'supabase/**'
      # legacy PWA files that still live in this repo
      - 'src/**'
      - 'public/**'
      - 'netlify/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Secrets are given only to the steps that need them (not to third-party actions), and actions
    # are pinned to commit SHAs so a moved tag can't run new code next to the signing key.
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          # The repo's default branch is not this app's branch, so allow cache writes everywhere.
          cache-read-only: false

      - name: Domain unit tests (dose engine golden tests)
        run: ./gradlew -p domain test --console=plain

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: App unit tests + release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --console=plain

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Collect APK
        id: apk
        run: |
          VERSION_NAME="$(grep -E '^appVersion=' gradle.properties | cut -d= -f2).${{ github.run_number }}"
          SRC="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          mkdir -p out
          cp "$SRC" "out/MeanwhileV4-$VERSION_NAME.apk"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          if [ -n "$KEYSTORE_PATH" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: apk
          path: out/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: steps.apk.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.apk.outputs.version_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk --clobber
          else
            gh release create "$TAG" out/*.apk \
              --title "MeanwhileV4 ${{ steps.apk.outputs.version_name }}" \
              --notes-file docs/RELEASE_NOTES.md \
              --target "${{ github.sha }}" \
              --latest
          fi

      - name: Signing secrets missing
        if: steps.apk.outputs.signed != 'true'
        run: echo "::warning::APK built but not released. Add the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets (docs/INSTALL.md), then re-run this workflow."

      - name: Auto-configure Supabase auth
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then exit 0; fi
          api="https://api.supabase.com/v1/projects/$PROJECT_REF"
          hdr="Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
          # Account creation stays one step: no email-confirmation link.
          curl -sf -X PATCH "$api/config/auth" -H "$hdr" -H "content-type: application/json" \
            -d '{"mailer_autoconfirm": true}' > /dev/null || echo "::warning::could not set mailer_autoconfirm"
          users=$(curl -sf -X POST "$api/database/query" -H "$hdr" -H "content-type: application/json" \
            -d '{"query": "select count(*)::int as n from auth.users"}' \
            | python3 -c 'import sys, json; d = json.load(sys.stdin); print(d[0]["n"] if isinstance(d, list) and d else "")' \
            2> /dev/null || echo "")
          if [ -n "$users" ] && [ "$users" -ge 1 ] 2> /dev/null; then
            # An account exists (Danny's): nobody else gets to create one.
            if curl -sf -X PATCH "$api/config/auth" -H "$hdr" -H "content-type: application/json" \
              -d '{"disable_signup": true}' > /dev/null; then
              echo "- :lock: Sign-ups disabled ($users account(s) exist) — nothing to do" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::could not disable sign-ups — see docs/INSTALL.md §5e"
            fi
          else
            echo "- :unlock: No account yet — create yours in the app; the next build locks sign-ups automatically" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup status
        if: always()
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
          HAS_APP_KEYS: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_ANON_KEY != '' }}
          HAS_DEPLOY: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_PROJECT_REF != '' && secrets.SUPABASE_DB_PASSWORD != '' }}
        run: |
          {
            echo "## Setup status (docs/INSTALL.md)"
            [ "$HAS_KEYSTORE" = "true" ] && echo "- :white_check_mark: Signing — Releases publish automatically" \
              || echo "- :x: Signing secrets missing (§1): no installable Release until added"
            [ "$HAS_APP_KEYS" = "true" ] && echo "- :white_check_mark: Supabase URL + anon key baked into the APK" \
              || echo "- :x: SUPABASE_URL / SUPABASE_ANON_KEY missing (§5c): app will be local-only"
            [ "$HAS_DEPLOY" = "true" ] && echo "- :white_check_mark: Supabase automation (schema, functions, auth lockdown)" \
              || echo "- :x: SUPABASE_ACCESS_TOKEN / PROJECT_REF / DB_PASSWORD missing (§5c)"
            echo ""
            echo "AI keys are checked in Supabase, not here — set GEMINI_API_KEY / ANTHROPIC_API_KEY as function secrets (§7)."
          } >> "$GITHUB_STEP_SUMMARY"
