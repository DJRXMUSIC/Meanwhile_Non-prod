name: android

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
      # migrations stay in: the app's sync contract test reads them
      - 'supabase/functions/**'
      - 'supabase/tests/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase.yml'
      # legacy PWA files that still live in this repo
      - 'src/**'
      - 'public/**'
      - 'netlify/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Secrets are given only to the steps that need them (not to third-party actions), and actions
    # are pinned to commit SHAs so a moved tag can't run new code next to the signing key.
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          # The repo's default branch is not this app's branch, so allow cache writes everywhere.
          cache-read-only: false

      - name: Domain tests (dose engine golden tests, learning, router)
        run: ./gradlew -p domain test --console=plain

      # No secrets here. Runs even if the domain tests failed, so one run shows every failure.
      - name: App tests (Robolectric - database, sync contract, learning engine, NBA, logging)
        if: ${{ !cancelled() }}
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Test summary
        if: ${{ !cancelled() }}
        run: python3 scripts/junit-summary.py "Domain=domain/build/test-results" "App=app/build/test-results" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: test-reports
          path: |
            domain/build/reports/tests/
            app/build/reports/tests/
            domain/build/test-results/
            app/build/test-results/
          retention-days: 14

      # One token runs the backend: finds or creates the Supabase project, applies the schema,
      # configures auth and exports the app's URL + anon key for the build. It writes no secrets.
      - name: Supabase (project, schema, auth)
        id: supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          echo "## Setup status (docs/INSTALL.md)" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/ci/supabase_setup.py backend --create

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        if: steps.supabase.outputs.ref != '' && steps.supabase.outputs.function_deployed != 'true'
        with:
          version: latest

      - name: Deploy the AI function (first time; the supabase workflow deploys later changes)
        if: steps.supabase.outputs.ref != '' && steps.supabase.outputs.function_deployed != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.supabase.outputs.ref }}
        run: supabase functions deploy ai --project-ref "$PROJECT_REF"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "- :white_check_mark: **Signing:** Releases publish automatically" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Release APK
        env:
          # The Supabase step exported SUPABASE_URL / SUPABASE_ANON_KEY; these older per-value
          # secrets are only a fallback. Alias and key password default to the generated keystore's.
          URL_SECRET: ${{ secrets.SUPABASE_URL }}
          ANON_KEY_SECRET: ${{ secrets.SUPABASE_ANON_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          export SUPABASE_URL="${SUPABASE_URL:-$URL_SECRET}" SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-$ANON_KEY_SECRET}"
          export KEY_ALIAS="${KEY_ALIAS_SECRET:-meanwhile}" KEY_PASSWORD="${KEY_PASSWORD_SECRET:-$KEYSTORE_PASSWORD}"
          ./gradlew :app:assembleRelease --console=plain

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Collect APK
        id: apk
        run: |
          VERSION_NAME="$(grep -E '^appVersion=' gradle.properties | cut -d= -f2).${{ github.run_number }}"
          SRC="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          mkdir -p out
          cp "$SRC" "out/MeanwhileV4-$VERSION_NAME.apk"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          if [ -n "$KEYSTORE_PATH" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: apk
          path: out/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: steps.apk.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.apk.outputs.version_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk --clobber
          else
            gh release create "$TAG" out/*.apk \
              --title "MeanwhileV4 ${{ steps.apk.outputs.version_name }}" \
              --notes-file docs/RELEASE_NOTES.md \
              --target "${{ github.sha }}" \
              --latest
          fi

      - name: Not released
        if: steps.apk.outputs.signed != 'true'
        run: |
          echo "::warning::APK built but not released: add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets (docs/INSTALL.md §2), then re-run this workflow."
          echo "- :x: **Signing:** add \`KEYSTORE_BASE64\` + \`KEYSTORE_PASSWORD\` (§2) — until then the APK below is unsigned and no Release is published" >> "$GITHUB_STEP_SUMMARY"
